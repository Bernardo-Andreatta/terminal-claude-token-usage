[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stradiz-claude-tokens"
version = "1.1.0"
description = "Live terminal TUI tracking Claude Code token usage and cost estimates"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Bernardo Andreatta", email = "bernardo.giraldi.andreatta@gmail.com" }]
keywords = ["claude", "anthropic", "token", "tui", "terminal", "usage", "cost"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/Bernardo-Andreatta/terminal-claude-token-usage"
Repository = "https://github.com/Bernardo-Andreatta/terminal-claude-token-usage"
"Bug Tracker" = "https://github.com/Bernardo-Andreatta/terminal-claude-token-usage/issues"

[project.scripts]
claude-tokens = "claude_tokens.__main__:main"
claude-tokens-calibrate = "claude_tokens.calibrate:main"
claude-tokens-colors    = "claude_tokens.colors:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["claude_tokens*"]
